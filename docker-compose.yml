services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: grantbridge
      POSTGRES_USER: grantbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantbridge -d grantbridge"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - grantbridge_db:/var/lib/postgresql/data

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://grantbridge:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/grantbridge
      UPLOAD_DIR: /srv/grantbridge/private_uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - grantbridge_documents:/srv/grantbridge/private_uploads

volumes:
  grantbridge_db:
  grantbridge_documents:
